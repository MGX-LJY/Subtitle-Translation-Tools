<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字幕翻译器 · Grok</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --ink:#1a1d29; --muted:#8a90a2;
    --line:#e9ebf2; --line-2:#f1f2f7;
    --accent:#6d5efc; --accent-2:#8b7dff; --accent-soft:#eee9ff;
    --ok:#16a34a; --warn:#e07b00; --danger:#e23d54;
    --shadow:0 1px 2px rgba(20,22,40,.04), 0 8px 24px rgba(20,22,40,.06);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink); background:var(--bg); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex; flex-direction:column; height:100vh;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; gap:14px; padding:12px 22px;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:11px;}
  .logo{
    width:36px; height:36px; border-radius:11px; flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid; place-items:center; color:#fff;
    box-shadow:0 4px 12px rgba(109,94,252,.35);
  }
  .brand h1{font-size:15.5px; margin:0; font-weight:650; letter-spacing:.2px;}
  .brand .tag{font-size:11.5px; color:var(--muted); font-weight:500;}
  .grow{flex:1;}

  /* chips */
  .chips{display:flex; gap:8px; align-items:center;}
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:5px 11px;
    background:var(--line-2); border-radius:999px; font-size:12px; color:#555a6b;
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .chip b{font-weight:650; color:var(--ink);}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 14px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:10px; font-size:13.5px; font-weight:550; cursor:pointer;
    transition:.15s ease; white-space:nowrap; user-select:none;
  }
  .btn svg{width:16px;height:16px;}
  .btn:hover{background:#fafaff; border-color:#dcdef0; transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff; border:none; box-shadow:0 4px 14px rgba(109,94,252,.3);
  }
  .btn.primary:hover{box-shadow:0 6px 18px rgba(109,94,252,.42);}
  .btn.ghost{background:transparent; border-color:transparent;}
  .btn.ghost:hover{background:var(--line-2);}
  .btn.icon{width:36px; padding:0; justify-content:center;}

  .toolbar{display:flex; align-items:center; gap:9px; padding:14px 22px 0;}
  .toolbar .divider{width:1px; height:22px; background:var(--line); margin:0 3px;}

  /* ---------- Progress ---------- */
  .progress-rail{height:3px; background:transparent; margin:14px 22px 0; border-radius:3px; overflow:hidden;}
  .progress-rail.active{background:var(--line);}
  .progress-bar{
    height:100%; width:0%; border-radius:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .25s ease;
  }

  /* ---------- Content ---------- */
  .content{flex:1; min-height:0; padding:16px 22px 22px; display:flex;}
  .card{
    flex:1; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;
    display:flex; flex-direction:column; min-height:0;
  }
  .table-scroll{overflow:auto; flex:1; min-height:0;}
  table{width:100%; border-collapse:collapse; table-layout:fixed;}
  thead th{
    position:sticky; top:0; z-index:3; background:#fbfbfe; text-align:left;
    font-size:11.5px; font-weight:600; letter-spacing:.4px; color:var(--muted);
    text-transform:uppercase; padding:11px 14px; border-bottom:1px solid var(--line);
  }
  tbody td{
    padding:10px 14px; border-bottom:1px solid var(--line-2);
    vertical-align:top; white-space:pre-wrap; word-break:break-word; font-size:13.5px;
  }
  tbody tr{transition:background .12s;}
  tbody tr:hover{background:#fafaff;}
  .col-idx{width:54px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .col-time{width:104px; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums;}
  .col-act{width:64px;}
  td.edit{cursor:text; border-radius:6px;}
  td.edit:empty::before{content:"—"; color:#c9cdda;}
  td.edit:focus{outline:2px solid var(--accent); outline-offset:-2px; background:#fff;}
  td.tr-trans:not(:empty){color:var(--ink);}
  /* just-updated flash */
  @keyframes flash{from{background:var(--accent-soft);} to{background:transparent;}}
  tr.flash{animation:flash 1s ease;}
  .mini{
    border:1px solid var(--line); background:var(--panel); color:var(--muted);
    height:26px; padding:0 9px; border-radius:7px; font-size:12px; cursor:pointer; transition:.15s;
  }
  .mini:hover{color:var(--danger); border-color:#f3c6cd; background:#fff5f6;}

  /* ---------- Empty state ---------- */
  .empty{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:var(--muted); padding:40px;}
  .empty .ill{
    width:84px; height:84px; border-radius:22px; display:grid; place-items:center;
    background:var(--accent-soft); color:var(--accent);
  }
  .empty h2{margin:0; font-size:16px; color:var(--ink); font-weight:600;}
  .empty p{margin:0; font-size:13px;}
  .dropzone.drag{outline:2px dashed var(--accent); outline-offset:-10px; background:var(--accent-soft);}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(26,29,41,.42); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:60; padding:20px;
  }
  .overlay.show{display:flex; animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}
  .modal{
    width:460px; max-width:100%; background:var(--panel); border-radius:18px;
    box-shadow:0 24px 70px rgba(20,22,40,.35); overflow:hidden; animation:pop .2s ease;
  }
  @keyframes pop{from{transform:translateY(8px) scale(.98); opacity:0;} to{transform:none; opacity:1;}}
  .modal header{display:flex; align-items:center; gap:10px; padding:20px 22px 6px;}
  .modal header .logo{width:30px;height:30px;border-radius:9px;}
  .modal h2{margin:0; font-size:16.5px; font-weight:650;}
  .modal .body{padding:14px 22px 4px;}
  .field{margin-bottom:15px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:550;}
  .field input,.field select{
    width:100%; height:40px; padding:0 12px; border:1px solid var(--line);
    border-radius:10px; font-size:13.5px; background:#fcfcff; color:var(--ink); transition:.15s;
  }
  .field input:focus,.field select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:#fff;}
  .field .hint{font-size:11px; color:var(--muted); margin-top:5px;}
  .modal footer{display:flex; justify-content:flex-end; gap:10px; padding:8px 22px 20px;}

  /* ---------- Toast ---------- */
  .toasts{position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:10px; z-index:80;}
  .toast{
    display:flex; align-items:center; gap:10px; min-width:220px; max-width:360px;
    padding:12px 15px; background:var(--ink); color:#fff; border-radius:12px;
    box-shadow:0 12px 30px rgba(20,22,40,.3); font-size:13px; animation:slidein .25s ease;
  }
  @keyframes slidein{from{transform:translateX(20px); opacity:0;} to{transform:none; opacity:1;}}
  .toast.ok{background:#10331f; border-left:3px solid var(--ok);}
  .toast.err{background:#3a1620; border-left:3px solid var(--danger);}
  .toast.info{background:#1a1d29;}
  .toast .ic{flex:none; display:grid; place-items:center;}
</style>
</head>
<body>
<div class="app">

  <!-- Top bar -->
  <div class="topbar">
    <div class="brand">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14M5 8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2M5 8v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M9 13h6M9 17h3"/></svg>
      </div>
      <div>
        <h1>字幕翻译器</h1>
        <div class="tag">Powered by Grok</div>
      </div>
    </div>
    <div class="grow"></div>
    <div class="chips">
      <span class="chip" id="chip-file" style="display:none"></span>
      <span class="chip"><span class="dot"></span>Tokens <b id="tok-p">0</b> / <b id="tok-c">0</b></span>
    </div>
    <button class="btn icon ghost" id="btn-settings" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <input type="file" id="file-input" accept=".srt" hidden>
    <button class="btn" id="btn-open">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      打开
    </button>
    <button class="btn primary" id="btn-translate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></svg>
      全部翻译
    </button>
    <button class="btn" id="btn-fix">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      全部修复
    </button>
    <div class="divider"></div>
    <button class="btn" id="btn-undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      撤销
    </button>
    <button class="btn" id="btn-export">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
      导出
    </button>
  </div>

  <!-- Progress -->
  <div class="progress-rail" id="rail"><div class="progress-bar" id="bar"></div></div>

  <!-- Content -->
  <div class="content">
    <div class="card">
      <div class="table-scroll dropzone" id="dropzone">
        <table>
          <colgroup>
            <col class="col-idx"><col class="col-time"><col class="col-time">
            <col><col><col><col class="col-act">
          </colgroup>
          <thead>
            <tr><th>#</th><th>开始</th><th>结束</th><th>原文</th><th>译文</th><th>修复后</th><th></th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="empty">
          <div class="ill">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 10h8M8 13h5"/></svg>
          </div>
          <h2>拖入或打开一个 SRT 字幕</h2>
          <p>支持把 .srt 文件直接拖到这里，或点击左上角「打开」</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <header>
      <div class="logo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.2 4.2l2.9 2.9M16.9 16.9l2.9 2.9M1 12h4M19 12h4M4.2 19.8l2.9-2.9M16.9 7.1l2.9-2.9"/></svg></div>
      <h2>设置</h2>
    </header>
    <div class="body">
      <div class="field">
        <label>API Key</label>
        <input id="set-api" type="password" placeholder="xai-...">
        <div class="hint">在 console.x.ai 获取，仅保存在本机 config.json</div>
      </div>
      <div class="field">
        <label>接口地址</label>
        <input id="set-url" placeholder="https://api.x.ai/v1">
      </div>
      <div class="field">
        <label>模型</label>
        <select id="set-model">
          <option>grok-4</option><option>grok-3</option>
          <option>grok-3-mini</option><option>grok-2-1212</option>
        </select>
      </div>
      <div class="field">
        <label>目标语言</label>
        <select id="set-lang">
          <option>中文</option><option>English</option><option>日本語</option>
          <option>Español</option><option>Français</option><option>Deutsch</option>
        </select>
      </div>
    </div>
    <footer>
      <button class="btn ghost" id="set-cancel">取消</button>
      <button class="btn primary" id="set-save">保存设置</button>
    </footer>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
const $ = id => document.getElementById(id);
let cues = [];
let running = false;

/* ---------- toast ---------- */
const ICONS = {
  ok:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  err:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  info:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16v-4M12 8h.01"/><circle cx="12" cy="12" r="10"/></svg>',
};
function toast(msg, type='info', ms=2800){
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span class="ic">${ICONS[type]||ICONS.info}</span><span>${msg}</span>`;
  $('toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='.25s'; el.style.opacity='0'; el.style.transform='translateX(20px)';
                   setTimeout(()=>el.remove(),250); }, ms);
}

/* ---------- render ---------- */
function escapeHtml(s){ return (s??'').replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

function refreshEmpty(){ $('empty').style.display = cues.length ? 'none' : 'flex'; }

function renderTable(){
  const tb = $('tbody'); tb.innerHTML = '';
  cues.forEach((c,i)=>{
    const tr = document.createElement('tr');
    tr.dataset.idx = i;
    tr.innerHTML = `
      <td class="col-idx">${c.index}</td>
      <td class="col-time">${escapeHtml(c.start)}</td>
      <td class="col-time">${escapeHtml(c.end)}</td>
      <td>${escapeHtml(c.original)}</td>
      <td class="edit tr-trans" contenteditable data-field="translation">${escapeHtml(c.translation)}</td>
      <td class="edit" contenteditable data-field="fixed_text">${escapeHtml(c.fixed_text)}</td>
      <td class="col-act"></td>`;
    tb.appendChild(tr);
    syncRestore(i);
  });
  tb.querySelectorAll('td.edit').forEach(td=>{
    td.addEventListener('blur', async ()=>{
      const idx = +td.closest('tr').dataset.idx, field = td.dataset.field, value = td.innerText;
      if(cues[idx][field] === value) return;
      cues[idx][field] = value;
      await fetch(`/api/cues/${idx}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({[field]:value})});
      syncRestore(idx);
    });
  });
  refreshEmpty();
}

function updateRow(idx, translation, fixed_text){
  cues[idx].translation = translation; cues[idx].fixed_text = fixed_text;
  const tr = $('tbody').querySelector(`tr[data-idx="${idx}"]`);
  if(!tr) return;
  tr.children[4].innerText = translation;
  tr.children[5].innerText = fixed_text;
  tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash');
  syncRestore(idx);
}

function syncRestore(idx){
  const tr = $('tbody').querySelector(`tr[data-idx="${idx}"]`);
  if(!tr) return;
  const cell = tr.children[6], c = cues[idx];
  if(c.translation || c.fixed_text){
    cell.innerHTML = '<button class="mini" title="清空本行译文/修复">恢复</button>';
    cell.querySelector('button').onclick = async ()=>{
      await fetch(`/api/restore/${idx}`,{method:'POST'}); updateRow(idx,'','');
    };
  } else cell.innerHTML = '';
}

function setFileChip(name,n){
  const chip = $('chip-file');
  chip.style.display = 'inline-flex';
  chip.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg> ${escapeHtml(name)} · <b>${n}</b> 行`;
}

/* ---------- file ---------- */
async function uploadFile(f){
  if(!f) return;
  if(!f.name.toLowerCase().endsWith('.srt')){ toast('请选择 .srt 文件','err'); return; }
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch('/api/upload',{method:'POST',body:fd});
  const data = await r.json();
  cues = data.cues; renderTable(); setFileChip(data.filename, cues.length);
  toast(`已加载 ${cues.length} 行字幕`,'ok');
}
$('btn-open').onclick = ()=> $('file-input').click();
$('file-input').addEventListener('change', e=>{ uploadFile(e.target.files[0]); e.target.value=''; });

// drag & drop
const dz = $('dropzone');
['dragenter','dragover'].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add('drag'); }));
['dragleave','drop'].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.remove('drag'); }));
dz.addEventListener('drop', e=>{ if(e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]); });

$('btn-export').onclick = ()=>{
  if(!cues.length){ toast('请先加载 SRT','err'); return; }
  window.location = '/api/export';
};
$('btn-undo').onclick = async ()=>{
  const data = await (await fetch('/api/undo',{method:'POST'})).json();
  cues = data.cues; renderTable(); toast('已撤销','info');
};

/* ---------- translate / fix ---------- */
function setRunning(v){
  running = v;
  ['btn-open','btn-translate','btn-fix','btn-undo','btn-export'].forEach(id=> $(id).disabled = v);
  $('rail').classList.toggle('active', v);
  if(!v) setTimeout(()=>{ if(!running){ $('bar').style.width='0%'; } }, 600);
}
function runTask(mode){
  if(!cues.length){ toast('请先加载 SRT','err'); return; }
  if(running) return;
  setRunning(true);
  $('tok-p').textContent='0'; $('tok-c').textContent='0';
  $('bar').style.width='0%';
  const proto = location.protocol==='https:'?'wss':'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/translate`);
  ws.onopen = ()=> ws.send(JSON.stringify({mode}));
  ws.onmessage = ev=>{
    const m = JSON.parse(ev.data);
    if(m.type==='row') updateRow(m.idx, m.translation, m.fixed_text);
    else if(m.type==='progress') $('bar').style.width = (m.done/m.total*100)+'%';
    else if(m.type==='tokens'){ $('tok-p').textContent=m.ptok; $('tok-c').textContent=m.ctok; }
    else if(m.type==='error') toast(m.message,'err',5000);
    else if(m.type==='finished'){ toast(mode==='translate'?'翻译完成':'修复完成','ok'); setRunning(false); ws.close(); }
  };
  ws.onerror = ()=>{ toast('连接服务出错','err'); setRunning(false); };
  ws.onclose = ()=>{ if(running) setRunning(false); };
}
$('btn-translate').onclick = ()=> runTask('translate');
$('btn-fix').onclick = ()=> runTask('fix');

/* ---------- settings ---------- */
$('btn-settings').onclick = async ()=>{
  const cfg = await (await fetch('/api/config')).json();
  $('set-api').value = cfg.api_key||''; $('set-url').value = cfg.base_url||'';
  $('set-model').value = cfg.model||'grok-4'; $('set-lang').value = cfg.target_lang||'中文';
  $('overlay').classList.add('show');
};
$('set-cancel').onclick = ()=> $('overlay').classList.remove('show');
$('overlay').addEventListener('click', e=>{ if(e.target===$('overlay')) $('overlay').classList.remove('show'); });
$('set-save').onclick = async ()=>{
  await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    api_key:$('set-api').value, base_url:$('set-url').value,
    model:$('set-model').value, target_lang:$('set-lang').value
  })});
  $('overlay').classList.remove('show'); toast('配置已保存','ok');
};

/* ---------- restore session ---------- */
(async ()=>{
  try{
    const data = await (await fetch('/api/cues')).json();
    if(data.cues?.length){ cues=data.cues; renderTable(); setFileChip(data.filename||'session', cues.length); }
    else refreshEmpty();
  }catch(e){ refreshEmpty(); }
})();
</script>
</body>
</html>
